name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in package.json; also runs pnpm install
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
      - run: pnpm -r --if-present run check-types
      - run: pnpm -r --if-present run lint
      # GLOSSARY.md Avoid terms that are wrong in every context; context-dependent ones stay with review
      - run: |
          ! git grep -nIiE 'text[ _-]?nodes?\b|\block(s|ed)?\b|non-?editable|(unknown|unsupported) class|styling mode|text content|visual change' \
            -- packages docs/specs ':!docs/specs/project-spec.md'
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run build
      # next build rewrites tracked files it disagrees with (tsconfig); fail instead of drifting
      - run: git diff --exit-code
