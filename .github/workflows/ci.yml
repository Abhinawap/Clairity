name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in package.json; also runs pnpm install
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
      - run: pnpm -r --if-present run check-types
      - run: pnpm -r --if-present run lint
      # GLOSSARY.md _Avoid_ terms that are wrong in every context, camelCase included; context-dependent ones stay with review.
      # Text node allows no "_" and text content no join, so DOM's TEXT_NODE and textContent pass. project-spec.md predates the glossary.
      - run: |
          ! git grep -nIiE '\btext[ -]?nodes?\b|\block(s|ed)?\b|\bnon[ _-]?editable\b|\b(unknown|unsupported)[ _-]?class(es)?\b|\bstyling[ _-]?modes?\b|\btext[ -]content\b|\bvisual[ _-]?changes?\b' \
            -- packages docs/specs ':!docs/specs/project-spec.md'
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run build
      # next build rewrites tracked files it disagrees with (tsconfig); fail instead of drifting
      - run: git diff --exit-code
